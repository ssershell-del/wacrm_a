<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WACRM AI | Hunter V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-green: #00ffa3;
            --neon-blue: #00d1ff;
            --glass-bg: rgba(20, 20, 25, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #030303;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 255, 163, 0.05) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 209, 255, 0.05) 0%, transparent 20%);
            color: #fff; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Style Glassmorphism Avancé */
        .glass { 
            background: var(--glass-bg); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Inputs Style HUD */
        .hud-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .hud-input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 163, 0.2);
            background: rgba(0, 255, 163, 0.05);
        }

        /* Bouton "Glow" */
        .btn-neon {
            background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
            position: relative;
            z-index: 1;
            overflow: hidden;
        }
        .btn-neon::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s;
        }
        .btn-neon:active::before { opacity: 1; }
        .btn-neon:active { transform: scale(0.98); }

        /* Animations */
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        .loader {
            width: 48px; height: 48px;
            border: 3px solid #FFF;
            border-bottom-color: var(--neon-green);
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Typo Mono pour les données */
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Suppression des flèches par défaut sur input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start pt-8 px-4 pb-10">

    <div class="w-full max-w-2xl relative z-10">
        
        <header class="text-center mb-8 animate-fade-in" style="animation-delay: 0.1s;">
            <div class="inline-block relative">
                <h1 class="text-4xl md:text-5xl font-black tracking-tighter italic">
                    WACRM <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#00ffa3] to-[#00d1ff]">PRO</span>
                </h1>
                <div class="absolute -bottom-2 right-0 text-[10px] font-mono text-gray-400 bg-white/5 px-2 py-0.5 rounded border border-white/10">V2.0.4</div>
            </div>
            <p class="text-gray-400 text-xs mt-3 uppercase tracking-[0.2em] font-medium">Viral Intelligence System</p>
        </header>

        <div class="glass p-1 rounded-[32px] animate-fade-in" style="animation-delay: 0.2s;">
            <div class="bg-black/40 rounded-[28px] p-6 md:p-8">
                <form id="scanForm" class="space-y-5">
                    
                    <div class="space-y-2">
                        <label class="text-[10px] uppercase tracking-widest text-gray-500 font-bold ml-1">Cible / Niche</label>
                        <div class="relative">
                            <input type="text" id="niche" placeholder="Ex: Anime Edit, Real Estate..." 
                                   class="hud-input w-full p-4 rounded-2xl text-lg font-semibold focus:outline-none placeholder-gray-600">
                            <div class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            </div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <label class="text-[10px] uppercase tracking-widest text-gray-500 font-bold ml-1">Min Vues</label>
                            <input type="text" id="min_views" value="1M" placeholder="1M" 
                                   class="hud-input w-full p-4 rounded-2xl text-center font-mono font-bold focus:outline-none">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] uppercase tracking-widest text-gray-500 font-bold ml-1">Scan Limit</label>
                            <div class="relative">
                                <input type="number" id="nb_videos" value="3" min="1" max="100"
                                       class="hud-input w-full p-4 rounded-2xl text-center font-mono font-bold focus:outline-none text-[#00ffa3]">
                                <div class="absolute right-3 top-1/2 -translate-y-1/2 text-[10px] text-gray-600 font-bold">MAX 100</div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="group relative w-full btn-neon text-black font-black py-5 rounded-2xl transition-all shadow-[0_0_20px_rgba(0,255,163,0.3)] hover:shadow-[0_0_40px_rgba(0,255,163,0.5)] mt-2">
                        <span class="relative flex items-center justify-center gap-2 uppercase tracking-widest text-sm">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            Lancer l'Extraction
                        </span>
                    </button>
                </form>
            </div>
        </div>

        <div id="loading" class="hidden flex flex-col items-center justify-center py-12 animate-fade-in">
            <div class="loader mb-6"></div>
            <p class="text-[#00ffa3] text-sm font-bold animate-pulse uppercase tracking-widest">Analyse Neurale en cours...</p>
            <p class="text-gray-600 text-xs mt-2 font-mono">Décryptage des frames par Gemini 2.5</p>
        </div>

        <div id="resultsArea" class="hidden mt-8 space-y-6 animate-fade-in">
            <div class="flex justify-center">
                <a id="apiLink" href="#" target="_blank" class="glass px-4 py-2 rounded-full flex items-center gap-2 text-[10px] text-gray-400 hover:text-white transition group border border-[#00ffa3]/20">
                    <span class="w-2 h-2 rounded-full bg-[#00ffa3] animate-pulse"></span>
                    FLUX JSON GÉNÉRÉ
                    <svg class="w-3 h-3 group-hover:translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
            </div>

            <div id="cardsContainer" class="space-y-6 pb-10">
                </div>
        </div>
    </div>

    <script>
        document.getElementById('scanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Feedback
            const btn = e.target.querySelector('button');
            const originalBtnText = btn.innerHTML;
            btn.disabled = true;
            btn.style.opacity = '0.7';
            
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultsArea').classList.add('hidden');
            document.getElementById('cardsContainer').innerHTML = '';

            const formData = new FormData();
            formData.append('niche', document.getElementById('niche').value);
            formData.append('nb_videos', document.getElementById('nb_videos').value);
            formData.append('min_views', document.getElementById('min_views').value);

            try {
                const res = await fetch('/scan', { method: 'POST', body: formData });
                const result = await res.json();

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('resultsArea').classList.remove('hidden');
                
                const apiLinkEl = document.getElementById('apiLink');
                apiLinkEl.href = result.api_link;

                // Animation séquentielle des cartes
                result.data.forEach((item, index) => {
                    const delay = index * 150;
                    const card = `
                        <div class="glass p-1 rounded-3xl animate-fade-in" style="animation-delay: ${delay}ms">
                            <div class="bg-[#0a0a0a] rounded-[22px] p-5 relative overflow-hidden">
                                <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-[#00ffa3] to-transparent"></div>
                                
                                <h3 class="font-bold text-lg mb-4 text-white leading-tight pr-4">${item.meta.title}</h3>
                                
                                <div class="space-y-3">
                                    <div class="bg-white/5 p-4 rounded-xl border border-white/5">
                                        <div class="flex items-center gap-2 mb-2">
                                            <span class="text-[10px] font-black text-[#00ffa3] bg-[#00ffa3]/10 px-2 py-0.5 rounded uppercase tracking-wider">Visual Hook</span>
                                        </div>
                                        <p class="text-gray-300 text-sm leading-relaxed">${item['1_VISUAL_HOOK'].scene_intro}</p>
                                        <div class="mt-3 pt-3 border-t border-white/5">
                                            <p class="text-xs text-gray-500 font-mono">⚡ ${item['1_VISUAL_HOOK'].effet_visuel_intro}</p>
                                        </div>
                                    </div>

                                    <div class="grid grid-cols-2 gap-3">
                                        <div class="bg-white/5 p-3 rounded-xl border border-white/5">
                                            <p class="text-[9px] font-bold text-gray-500 uppercase mb-1">Flow</p>
                                            <p class="text-xs font-semibold text-white">${item['2_SYNC_FLOW'].flow_type}</p>
                                        </div>
                                        <div class="bg-white/5 p-3 rounded-xl border border-white/5">
                                            <p class="text-[9px] font-bold text-gray-500 uppercase mb-1">Audio DNA</p>
                                            <p class="text-xs font-semibold text-white truncate">${item['4_AUDIO_DNA'].style_musique}</p>
                                        </div>
                                    </div>

                                    <div class="bg-gradient-to-r from-[#00ffa3]/10 to-transparent p-4 rounded-xl border border-[#00ffa3]/20 mt-2">
                                        <p class="text-[9px] font-bold text-[#00ffa3] uppercase mb-1 flex items-center gap-1">
                                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                            Conseil Pro
                                        </p>
                                        <p class="text-xs text-gray-200 italic">"${item['5_REPRODUCTION_GUIDE'].conseil_montage}"</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    document.getElementById('cardsContainer').innerHTML += card;
                });
            } catch (err) {
                alert("Erreur de connexion au serveur WACRM.");
                document.getElementById('loading').classList.add('hidden');
            } finally {
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.innerHTML = originalBtnText;
            }
        });
    </script>
</body>
</html>
